[project]
name = "parley"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
